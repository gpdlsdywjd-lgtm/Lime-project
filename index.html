<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>라임 코딩</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#f5f2eb; --ink:#2b2621; --muted:#7a6e65; --lime:#85b032;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; overflow:hidden;}
  button{font-family:inherit;cursor:pointer}
  .panel-sheet.show{opacity:1;pointer-events:auto}
  .panel-sheet.show .panel-sheet-inner{transform:translateY(0)}
  @keyframes bob{50%{transform:translate(-50%,-6px)}}

<body class="antialiased w-full h-screen flex flex-col overflow-hidden">
<div id="app" class="w-full h-full max-w-6xl mx-auto p-2 sm:p-4 flex flex-col justify-between">

  <header class="bg-[#fffdf9] border-2 border-[#d8cebe] shadow-[3px_3px_0_#d8cebe] p-2.5 sm:p-3 mb-2 rounded-xl w-full shrink-0">

        <h1 class="text-xl font-bold tracking-wide">라임 코딩</h1>
      </div>
      <p class="text-xs text-[#7a6e65]">방구석 인생 타이쿤 v3.1</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 pt-1.5 border-t border-[#eee6d8]">

        <div class="h-1.5 bg-[#eee6d8] mt-1 rounded overflow-hidden">
          <div id="bar-exp" class="h-full bg-[#85b032] w-0 transition-all duration-300"></div>
        </div>
      </div>
      <div class="bg-[#fcfbfa] border-2 border-[#e6decb] p-2 rounded-lg">

          <span id="mental-status-badge" class="text-[9px] font-bold px-1 rounded bg-[#fcfbfa] text-[#7a6e65]">안정</span>
        </div>
        <strong id="stat-mental" class="text-base sm:text-lg">52</strong>
        <div class="h-1.5 bg-[#eee6d8] mt-1 rounded overflow-hidden">
          <div id="bar-mental" class="h-full bg-[#d45c6e] w-[52%] transition-all duration-300"></div>
        </div>
      </div>
      <div class="bg-[#fcfbfa] border-2 border-[#e6decb] p-2 rounded-lg">
        <div class="flex justify-between items-center">
          <span class="text-[10px] text-[#7a6e65] tracking-wider block">체력</span>
          <span id="stamina-status-badge" class="text-[9px] font-bold px-1 rounded bg-[#fcfbfa] text-[#7a6e65]">보통</span>
        </div>
        <strong id="stat-stamina" class="text-base sm:text-lg">25</strong>
        <div class="h-1.5 bg-[#eee6d8] mt-1 rounded overflow-hidden">
          <div id="bar-stamina" class="h-full bg-[#3b82f6] w-[25%] transition-all duration-300"></div>
        </div>
      </div>
      <div class="bg-[#fcfbfa] border-2 border-[#e6decb] p-2 rounded-lg flex flex-col justify-center">
        <span class="text-[10px] text-[#7a6e65] tracking-wider block">라임 재화</span>
        <strong id="stat-gold" class="text-base sm:text-lg text-[#b8860b]">20</strong>
      </div>
    </div>
  </header>

    <section id="stage" class="bg-[#eef4e2] border-2 border-[#c4db9b] shadow-[4px_4px_0_#d8cebe] relative overflow-hidden flex-1 flex flex-col justify-between rounded-2xl p-3 sm:p-4 w-full">

      <div class="absolute top-3 left-3 z-10 bg-white/80 backdrop-blur border border-[#b2d264] px-2.5 py-0.5 text-xs rounded-full font-medium text-[#4a6b1e]">원룸 · 침대</div>

          <button type="button" class="icon-btn bg-white border-2 border-[#d8cebe] p-1.5 sm:p-2 flex flex-col items-center justify-center hover:bg-[#f4f8ed] active:scale-95 transition-all rounded-lg shadow-sm" data-tab="daily"><span class="text-base sm:text-lg">✅</span><span class="text-[9px] text-[#7a6e65] mt-0.5">퀘스트</span></button>
          <button type="button" class="icon-btn bg-white border-2 border-[#d8cebe] p-1.5 sm:p-2 flex flex-col items-center justify-center hover:bg-[#f4f8ed] active:scale-95 transition-all rounded-lg shadow-sm" data-tab="study"><span class="text-base sm:text-lg">📚</span><span class="text-[9px] text-[#7a6e65] mt-0.5">공부</span></button>

    </section>
  </main>
</div>

<div id="panel-sheet" class="panel-sheet fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-end justify-center opacity-0 pointer-events-none transition-opacity duration-200">

function todayKey(d){const x=d?new Date(d):new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function yesterdayKey(){const d=new Date();d.setDate(d.getDate()-1);return todayKey(d);}
function expNeed(level){return Math.floor(40+level*18+level*level*0.4);}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function formatTime(sec){const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
